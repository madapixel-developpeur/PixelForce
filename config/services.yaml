# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  files_directory: "%kernel.project_dir%/public/files"
  files_directory_relative: "files/"
  timezone: "%env(APP_TIMEZONE)%"
  stripe_public_key: "%env(STRIPE_PUBLIC_KEY)%"
  stripe_secret_key: "%env(STRIPE_SECRET_KEY)%"
  stripe_currency: "%env(STRIPE_CURRENCY)%"
  base_url: "%env(BASE_URL)%"
  pbb_ws_url: "%env(PBB_WS_URL)%"
  secteur_digital_id: "%env(SECTEUR_DIGITAL_ID)%"
  base_url_chat: "%env(BASE_URL_CHAT)%"
  socket_url_chat: "%env(SOCKET_URL_CHAT)%"
  finance_stat_url: "%env(FINANCE_STAT_URL)%"
  secteur_finance_id: "%env(SECTEUR_FINANCE_ID)%"
  inova_referral_link: "%env(INOVA_REFERRAL_LINK)%"
  catalogues_base_url: "%env(CATALOGUES_BASE_URL)%"
  secteur_securite_id: "%env(SECTEUR_SECURITE_ID)%"
  type_secteur_securite_id: "%env(TYPE_SECTEUR_SECURITE_ID)%"
  secteur_little_ponails_id: "%env(SECTEUR_LITTLE_PONAILS_ID)%"
  secteur_probot_x_id: "%env(SECTEUR_PROBOT_X_ID)%"
  probot_x_link_register: "%env(PROBOT_X_LINK_REGISTER)%"

  
services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name
  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones
  App\Services\FileHandler:
    arguments:
      $filesDirectory: "%files_directory%"

  App\Services\DocumentService:
    arguments:
      $filesDirectory: "%files_directory%"
      $baseUrl: "%base_url%"
  App\Services\DemandeDevisService:
    arguments:
      $filesDirectory: "%files_directory%"

  util.config: '@App\Services\ConfigSecteurService'
  util.auth: '@App\Services\AuthService'

  App\Twig\HelperFunction:
    tags: ["twig.extension"]

    # Configuration du contrôleur d'erreur personnalisé
  # App\Controller\ErrorController:
  #     tags: ['controller.service_arguments']

  App\Services\PdfExport:
    arguments:
      $projectDir: "%kernel.project_dir%"

  App\EventListener\SecteurListener:
    tags:
      - {
          name: "kernel.event_listener",
          event: "kernel.request",
          method: "onKernelRequest",
        }

  App\EventListener\LinkedAccountFromSectorPlatformListener:
    tags:
      - {
          name: "kernel.event_listener",
          event: "kernel.request",
          method: "onKernelRequest",
        }
  App\EventSubscriber\LocaleSubscriber:
    tags: ["kernel.event_subscriber"]

  App\EventListener\LpnTokenListener:
    tags:
      - {
          name: "kernel.event_listener",
          event: "kernel.request",
          method: "onKernelRequest",
        }
